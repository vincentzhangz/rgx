[package]
name = "rgx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fast indexed regex search for large codebases (Cursor paper)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
include = ["src/**"]

[lib]
name = "rgx"
path = "src/lib.rs"

[[bin]]
name = "rgx"
path = "src/main.rs"

[dependencies]
regex = { workspace = true }
regex-syntax = { workspace = true }
rgx-index = { version = "0.2.0", path = "../rgx-index" }
rgx-query = { version = "0.2.0", path = "../rgx-query" }
